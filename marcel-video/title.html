<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0a0a0f; font-family:'Inter',sans-serif; color:#e8e8f0; overflow:hidden; }
  .wrap { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .accent { width:64px; height:6px; background:#00d4aa; border-radius:3px; margin-bottom:40px; }
  .logo { font-weight:900; font-size:110px; letter-spacing:-0.03em; }
  .logo span { color:#00d4aa; }
  .tagline { margin-top:28px; font-weight:500; font-size:34px; color:#8888a0; letter-spacing:0.01em; }
  .foot { position:absolute; bottom:48px; font-weight:500; font-size:20px; color:#00d4aa; letter-spacing:0.22em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="accent"></div>
    <div class="logo">MARCEL<span>AI</span></div>
    <div class="tagline">AI-Powered Investment Research for Retail Investors</div>
    <div class="foot">Transparent &bull; Evidence-Backed &bull; No Hype</div>
  </div>
</body>
</html>
