<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0a0a0f; font-family:'Inter',sans-serif; color:#e8e8f0; overflow:hidden; }
  .wrap { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 180px; }
  .quote { font-weight:700; font-size:56px; line-height:1.25; letter-spacing:-0.02em; }
  .quote span { color:#00d4aa; }
  .cta { margin-top:48px; font-weight:600; font-size:30px; color:#8888a0; }
  .foot { position:absolute; bottom:48px; font-weight:600; font-size:22px; color:#00d4aa; letter-spacing:0.22em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="quote">Marcel doesn't pick winners.<br><span>Marcel finds facts.</span></div>
    <div class="cta">Smart investing, explained.</div>
    <div class="foot">Marcel AI &mdash; Investment Research</div>
  </div>
</body>
</html>
